# Per-client rate limiting zones. Keep API uploads on the existing, more
# generous budget while protecting dynamically rendered HTML from crawlers.
limit_req_zone $binary_remote_addr zone=homepage:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=homepage_html:10m rate=5r/s;
# Anti-harvest gate for /daily filtered views. Harvesting clients never
# execute JavaScript, so a filter query without the JS-issued cookie is
# answered with a lightweight stub instead of the full card grid.
map "$arg_keywords$arg_item_type" $daily_has_filter {
    "" 0;
    default 1;
}
map "$daily_has_filter$daily_gate_passed" $daily_gate_decision {
    "10" 1;
    default 0;
}
map $http_cookie $daily_gate_passed {
    default 0;
    "~daily_v=ok" 1;
}

# Only content-fingerprinted URLs are immutable. The short fallback keeps a
# direct, unversioned development URL recoverable after an asset replacement.
map $arg_v $homepage_static_cache_control {
    ""      "public, max-age=300";
    default "public, max-age=31536000, immutable";
}

# Reject traffic for unknown Host/SNI names before it can fall through to an
# unrelated virtual host on the same machine. This server is intentionally
# certificate-free: Nginx terminates unknown TLS handshakes immediately.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name foreverhyx.top www.foreverhyx.top;
    return 301 https://foreverhyx.top$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name www.foreverhyx.top;

    ssl_certificate /etc/letsencrypt/live/foreverhyx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foreverhyx.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://foreverhyx.top$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name foreverhyx.top;

    ssl_certificate /etc/letsencrypt/live/foreverhyx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foreverhyx.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 100M;
    send_timeout 5s;
    include /etc/nginx/snippets/cf-real-ip.conf;
    access_log off;

    # Compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cache filesystem metadata, not response bodies. Content changes remain
    # visible immediately through fingerprinted URLs while repeat static hits
    # avoid extra open/stat work.
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets — long-lived only when the URL carries a content hash.
    location /static/ {
        alias /srv/homepage/static/;
        # Build output is atomically replaced. Avoid cached descriptors so a
        # newly fingerprinted URL always sees the matching inode and length.
        open_file_cache off;
        etag on;
        add_header Cache-Control $homepage_static_cache_control always;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # FastAPI makes the public/private/share decision, then delegates file bytes
    # back to the internal Nginx alias with X-Accel-Redirect. Public URLs remain
    # unchanged while private files never pass through the Python worker.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        access_log off;
    }

    location /_homepage_uploads/ {
        internal;
        alias /srv/homepage/uploads/;
        # Uploaded files are atomically replaced in place. Do not retain an
        # old file descriptor after the URL version token changes.
        open_file_cache off;
        etag on;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API routes — proxy to FastAPI
    location /api/ {
        limit_req zone=homepage burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    include /etc/nginx/snippets/compiler-review-notes-location.conf;

    # Filtered views (keywords/item_type) require the JS-issued cookie;
    # plain /daily stays open for visitors and search engines.
    location = /daily {
        default_type text/html;
        if ($daily_gate_decision) {
            return 200 '<!doctype html><meta charset="utf-8"><title>Daily</title><script>(function(){document.cookie="daily_v=ok; path=/; max-age=604800; samesite=lax";if(/(^|;[ ]*)daily_v=ok/.test(document.cookie)){location.reload();}else{document.title="Cookies required";}})();</script>';
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Everything else (HTML pages) — proxy to FastAPI
    location / {
        limit_req zone=homepage_html burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
