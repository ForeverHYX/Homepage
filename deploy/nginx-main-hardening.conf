user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 10s;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    client_max_body_size 25m;

    # The stream layer supplies the public client address to the loopback TLS
    # listener. This keeps application logs and rate limits client-aware.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 200;
    reset_timedout_connection on;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

stream {
    # Only the live homepage names reach TLS termination. All retired and
    # unknown names are sent to a closed loopback port and fail immediately.
    map $ssl_preread_server_name $tls_backend {
        foreverhyx.top     127.0.0.1:8443;
        www.foreverhyx.top 127.0.0.1:8443;
        default            127.0.0.1:1;
    }

    server {
        listen 443 reuseport backlog=65535;
        listen [::]:443 reuseport backlog=65535;
        error_log /var/log/nginx/stream-error.log crit;

        ssl_preread on;
        preread_timeout 2s;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_buffer_size 4k;

        proxy_protocol on;
        proxy_pass $tls_backend;
    }
}
